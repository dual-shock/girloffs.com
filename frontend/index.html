    <title>Girloffs</title>
    <style>
        body.loading {
            overflow: hidden;
        }
        #loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: url('assets/branding/gradient3.png') center/cover no-repeat fixed, var(--hot-pink);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s;
        }
        #loading-logo {
            width: 180px;
            max-width: 60vw;
            opacity: 0.7;
            animation: loading-flash 1.2s infinite alternate;
        }
        @keyframes loading-flash {
            0% { opacity: 0.7; }
            100% { opacity: 0.15; }
        }
        body:not(.loading) #loading-overlay {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
        }
    </style>
</head>

    <header>
        <img src="assets/branding/Girloffs2Logo.png" alt="Girloffs" class="logo">
        <nav>
            <a href="#bracket" class="active mc-shadow" data-text="Bracket">Bracket</a>
            <a href="#schedule" class="mc-shadow" data-text="Schedule">Schedule</a>
            <a href="#players" class="mc-shadow" data-text="Players">Players</a>
            <a href="#results" class="mc-shadow" data-text="Results" style="opacity:60%;pointer-events: none;">Results</a>
        </nav>
        <div class="next-match-widget">
            <div class="next-match-label mc-shadow" data-text="Next Match">Next Match</div>

        </div>
        <div class="header-actions">
            <a class="twitch-link" target="_blank" rel="noopener">Live Now!</a>
        </div>
    </header>

    <main>
        <section id="bracket" class="tab-content active">
            <div class="bracket-scroll">
                <div class="bracket" id="bracket-container"></div>
            </div>
        </section>
        <section id="schedule" class="tab-content">
            <div class="schedule-container" id="schedule-container"></div>
        </section>
        <section id="players" class="tab-content">
            <div class="players-container" id="players-container"></div>
        </section>
        <section id="results" class="tab-content">Results</section>

    <footer>
        <a href="#">Twitch</a>

    <script>
    document.body.classList.add('loading');
    window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
            document.body.classList.remove('loading');
        }, 200);
    });
    </script>
