# The app container has no internet access of its own. It can only ask this proxy,
# and this proxy only opens HTTPS connections to the hosts listed in `allowlist`.
Port 8888
Listen 0.0.0.0
Timeout 30
MaxClients 20
LogLevel Notice
DisableViaHeader Yes

ConnectPort 443
Filter "/etc/tinyproxy/allowlist"
FilterType ere
FilterDefaultDeny Yes
